<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vo Huynh Ngọc Bảo Trâm – D&D Manager, Asahi Life</title>
<meta name="description" content="Danh thiếp điện tử của Vo Huynh Ngọc Bảo Trâm, D&D Manager tại Asahi Life.">
<meta name="theme-color" content="#d9ebfb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #d9ebfb;
    --bg-deep: #bfdcf6;
    --card: #f6faff;
    --ink: #12324f;
    --ink-soft: #4a6a88;
    --accent: #1f6fb8;
    --accent-dark: #16558d;
    --line: #c9def2;
    --font: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 18px calc(110px + env(safe-area-inset-bottom, 0px));
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 28px;
    box-shadow: 0 18px 50px rgba(31, 111, 184, .18);
    overflow: hidden;
    align-self: flex-start;
  }
  .top {
    background: var(--accent);
    padding: 40px 24px 84px;
    text-align: center;
    color: #fff;
  }
  .company { font-size: 15px; font-weight: 600; letter-spacing: .02em; opacity: .95; }
  .tagline { margin-top: 6px; font-size: 14px; font-weight: 500; font-style: italic; opacity: .85; }
  .avatar-wrap {
    width: 136px; height: 136px;
    margin: -68px auto 0;
    border-radius: 50%;
    border: 5px solid var(--card);
    background: var(--bg-deep);
    overflow: hidden;
    position: relative;
    box-shadow: 0 8px 22px rgba(18, 50, 79, .18);
  }
  .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar-wrap .initials {
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 700; color: var(--accent);
  }
  .avatar-wrap.no-img img { display: none; }
  .avatar-wrap.no-img .initials { display: flex; }
  .identity { padding: 18px 24px 8px; text-align: center; }
  h1 { font-size: 24px; line-height: 1.3; font-weight: 700; }
  .role { margin-top: 6px; font-size: 16px; font-weight: 500; color: var(--accent); }
  .info { list-style: none; padding: 14px 20px 26px; }
  .info li + li { border-top: 1px solid var(--line); }
  .info a, .info .row {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 6px;
    color: inherit; text-decoration: none;
    border-radius: 12px;
  }
  .info a:hover { background: #eaf3fc; }
  .info a:focus-visible, .save:focus-visible { outline: 3px solid var(--accent-dark); outline-offset: 2px; }
  .ico {
    flex: 0 0 42px; height: 42px; border-radius: 50%;
    background: #e1eefb; color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .ico svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .label { display: block; font-size: 12.5px; color: var(--ink-soft); }
  .value { display: block; font-size: 15.5px; font-weight: 500; word-break: break-word; }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(180deg, rgba(217,235,251,0) 0%, rgba(217,235,251,.92) 38%);
    display: flex; justify-content: center;
    pointer-events: none;
  }
  .save {
    pointer-events: auto;
    width: 100%; max-width: 420px;
    border: 0; cursor: pointer;
    background: var(--accent); color: #fff;
    font-family: var(--font); font-size: 17px; font-weight: 600;
    padding: 17px 20px; border-radius: 18px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 10px 26px rgba(31, 111, 184, .38);
    transition: background .15s, transform .1s;
  }
  .save:hover { background: var(--accent-dark); }
  .save:active { transform: scale(.98); }
  .save svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .save.done { background: #2a8a5b; }
  @media (prefers-reduced-motion: reduce) { .save { transition: none; } }
</style>
</head>
<body>

<main class="card">
  <div class="top">
    <div class="company">Asahi Life</div>
    <div class="tagline">Dream comes true</div>
  </div>

  <div class="avatar-wrap" id="avatarWrap">
    <img src="avatar.jpg" alt="Ảnh đại diện Vo Huynh Ngọc Bảo Trâm" id="avatarImg">
    <div class="initials" aria-hidden="true">BT</div>
  </div>

  <div class="identity">
    <h1>Vo Huynh Ngọc Bảo Trâm</h1>
    <p class="role">D&amp;D Manager</p>
  </div>

  <ul class="info">
    <li>
      <a href="tel:+84911462020">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></span>
        <span><span class="label">Điện thoại</span><span class="value">0911 462 020</span></span>
      </a>
    </li>
    <li>
      <a href="mailto:tramvo@asahilife.com">
        <span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
        <span><span class="label">Email</span><span class="value">tramvo@asahilife.com</span></span>
      </a>
    </li>
    <li>
      <a href="https://www.google.com/maps/search/?api=1&amp;query=Th%C3%A0nh+ph%E1%BB%91+H%E1%BB%93+Ch%C3%AD+Minh" target="_blank" rel="noopener">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
        <span><span class="label">Địa chỉ</span><span class="value">Tp. Hồ Chí Minh</span></span>
      </a>
    </li>
    <li>
      <div class="row">
        <span class="ico"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span>
        <span><span class="label">Công ty</span><span class="value">Asahi Life</span></span>
      </div>
    </li>
  </ul>
</main>

<div class="bar">
  <button class="save" id="saveBtn" type="button">
    <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
    <span id="saveText">Lưu vào danh bạ</span>
  </button>
</div>

<script>
  // Ảnh đại diện: nếu không tìm thấy avatar.jpg thì hiện chữ cái viết tắt
  var img = document.getElementById('avatarImg');
  var wrap = document.getElementById('avatarWrap');
  img.addEventListener('error', function () { wrap.classList.add('no-img'); });

  var CONTACT = {
    fullName: 'Vo Huynh Ngọc Bảo Trâm',
    family: 'Vo Huynh',
    given: 'Ngọc Bảo Trâm',
    org: 'Asahi Life',
    title: 'D&D Manager',
    phone: '0911462020',
    email: 'tramvo@asahilife.com',
    city: 'Tp. Hồ Chí Minh',
    note: 'Dream comes true'
  };

  function esc(s) { return s.replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,'); }

  // Chuyển ảnh thành base64 để đính kèm vào danh bạ (bỏ qua nếu không đọc được)
  function getPhotoBase64() {
    return new Promise(function (resolve) {
      if (wrap.classList.contains('no-img') || !img.complete || !img.naturalWidth) return resolve(null);
      try {
        var size = 256, c = document.createElement('canvas');
        c.width = size; c.height = size;
        var ctx = c.getContext('2d');
        var s = Math.min(img.naturalWidth, img.naturalHeight);
        var sx = (img.naturalWidth - s) / 2, sy = (img.naturalHeight - s) / 2;
        ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
        resolve(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
      } catch (e) { resolve(null); }
    });
  }

  function buildVCard(photo) {
    var lines = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:' + esc(CONTACT.family) + ';' + esc(CONTACT.given) + ';;;',
      'FN:' + esc(CONTACT.fullName),
      'ORG:' + esc(CONTACT.org),
      'TITLE:' + esc(CONTACT.title),
      'TEL;TYPE=CELL,VOICE:' + CONTACT.phone,
      'EMAIL;TYPE=WORK,INTERNET:' + CONTACT.email,
      'ADR;TYPE=WORK:;;;' + esc(CONTACT.city) + ';;;Việt Nam',
      'NOTE:' + esc(CONTACT.note)
    ];
    if (photo) {
      var p = 'PHOTO;ENCODING=b;TYPE=JPEG:' + photo;
      // gấp dòng theo chuẩn vCard (75 ký tự)
      var folded = p.match(/.{1,74}/g).join('\r\n ');
      lines.push(folded);
    }
    lines.push('END:VCARD');
    return lines.join('\r\n') + '\r\n';
  }

  document.getElementById('saveBtn').addEventListener('click', function () {
    var btn = this, txt = document.getElementById('saveText');
    getPhotoBase64().then(function (photo) {
      var blob = new Blob([buildVCard(photo)], { type: 'text/vcard;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'Vo-Huynh-Ngoc-Bao-Tram.vcf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      btn.classList.add('done');
      txt.textContent = 'Đã tạo danh bạ – hãy mở file để lưu';
      setTimeout(function () { btn.classList.remove('done'); txt.textContent = 'Lưu vào danh bạ'; }, 4000);
    });
  });
</script>
</body>
</html>
